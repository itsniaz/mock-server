name = "mock-server"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Worker runs first so it can gate the UI behind the PIN.
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

# PASSWORD (the PIN) is a secret: kept in .dev.vars locally (gitignored), uploaded with
#   npx wrangler deploy --secrets-file .dev.vars

[[kv_namespaces]]
binding = "KV"
id = "e339b9a2e851418f92ffb0feead06b6c" # from: npx wrangler kv namespace create MOCK

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
